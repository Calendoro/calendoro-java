name: Release
on:
  push: { tags: ["v*"] }
permissions: { contents: write, id-token: write, attestations: write }
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - run: test "v$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)" = "$GITHUB_REF_NAME"
      - run: mvn -B -P release deploy
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      - uses: actions/attest-build-provenance@v2
        with: { subject-path: "target/*.jar" }
      - run: gh release create "$GITHUB_REF_NAME" target/*.jar --generate-notes --verify-tag
        env: { GH_TOKEN: "${{ github.token }}" }
